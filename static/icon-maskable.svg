<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!--
		Maskable variant: full-bleed dark app tile, the green core + blue ring
		centered well inside the 80% safe zone (r ≤ 25.6). App-tile icons keep
		the dark tile; themed surfaces (favicon, in-app logo) adapt instead.
	-->
	<rect width="64" height="64" fill="#0B0D10"/>
	<circle cx="32" cy="32" r="13" fill="none" stroke="#4C8DFF" stroke-width="6"/>
	<circle cx="32" cy="32" r="5.5" fill="#3ECF8E"/>
</svg>
