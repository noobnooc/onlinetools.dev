<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!--
		onlinetools.dev mark — a green "online" core centered inside the blue
		"o" ring. The tile follows the viewer's color scheme (light tile in
		light mode, dark tile in dark) so the favicon is never dark-on-light.
	-->
	<style>
		.tile { fill: #FAFBFC; }
		.ring { stroke: #3672F0; }
		.dot  { fill: #16A06B; }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #0B0D10; }
			.ring { stroke: #4C8DFF; }
			.dot  { fill: #3ECF8E; }
		}
	</style>
	<rect class="tile" width="64" height="64" rx="14.5"/>
	<circle class="ring" cx="32" cy="32" r="13" fill="none" stroke-width="6"/>
	<circle class="dot" cx="32" cy="32" r="5.5"/>
</svg>
