<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!--
		onlinetools.dev mark — a green "online" core centered inside the blue
		"o" ring, on a transparent background so it sits cleanly on any tab
		bar. Ring/dot colors swap with the viewer's scheme for contrast.
	-->
	<style>
		.ring { stroke: #3672F0; }
		.dot  { fill: #16A06B; }
		@media (prefers-color-scheme: dark) {
			.ring { stroke: #4C8DFF; }
			.dot  { fill: #3ECF8E; }
		}
	</style>
	<circle class="ring" cx="32" cy="32" r="13" fill="none" stroke-width="6"/>
	<circle class="dot" cx="32" cy="32" r="5.5"/>
</svg>
